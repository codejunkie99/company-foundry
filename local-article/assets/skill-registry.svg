<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" aria-labelledby="title desc" role="img" viewBox="0 0 1200 640"><title id="title">Company skill registry</title><desc id="desc">A registry connects named company skills to evidence, model routes, artifacts, and review.</desc><rect width="1200" height="640" fill="#f7f8fa"/><text x="72" y="92" fill="#17191d" font-family="Arial, sans-serif" font-size="28" font-weight="700">The skill registry</text><text x="72" y="128" fill="#5b6470" font-family="Arial, sans-serif" font-size="18">Reusable procedures with an output contract, owner, review, and version.</text><rect width="315" height="366" x="72" y="178" fill="#17202a" rx="10"/><text x="104" y="222" fill="#fff" font-family="Arial, sans-serif" font-size="19" font-weight="700">REGISTRY</text><g fill="#d8e1ea" font-family="Arial, sans-serif" font-size="17"><text x="104" y="271">company-work-packet</text><text x="104" y="318">customer-evidence-research</text><text x="104" y="365">model-route-record</text><text x="104" y="412">company-code-delivery</text><text x="104" y="459">company-ui-artifact</text><text x="104" y="506">company-dashboard</text></g><g fill="none" stroke="#8191a1" stroke-width="3"><path d="M387 270H501"/><path d="M387 317H501"/><path d="M387 364H501"/><path d="M387 411H501"/><path d="M387 458H501"/><path d="M387 505H501"/></g><g fill="#fff" stroke="#1d5d74" stroke-width="3"><rect width="262" height="70" x="504" y="215" rx="8"/><rect width="262" height="70" x="504" y="305" rx="8"/><rect width="262" height="70" x="504" y="395" rx="8"/><rect width="262" height="70" x="504" y="485" rx="8"/></g><g fill="#1d3544" font-family="Arial, sans-serif" font-size="18" font-weight="700"><text x="536" y="258">evidence contract</text><text x="536" y="348">model route</text><text x="536" y="438">artifact contract</text><text x="536" y="528">review checks</text></g><path stroke="#8191a1" stroke-width="3" d="M766 250H860M766 340H860M766 430H860M766 520H860"/><rect width="266" height="350" x="862" y="210" fill="#e7f2ee" stroke="#28745d" stroke-width="3" rx="10"/><text x="898" y="262" fill="#1f5d4a" font-family="Arial, sans-serif" font-size="20" font-weight="700">A reliable run</text><g fill="#25483e" font-family="Arial, sans-serif" font-size="18"><text x="898" y="315">known inputs</text><text x="898" y="365">visible route receipt</text><text x="898" y="415">inspectable artifact</text><text x="898" y="465">named reviewer</text><text x="898" y="515">versioned learning</text></g></svg>