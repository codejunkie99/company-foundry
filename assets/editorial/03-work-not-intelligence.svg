, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" text-anchor="start">draft, inspect, and improve in parallel</text><line x1="1140" x2="1140" y1="622" y2="727" stroke="#cbd5e1" stroke-width="2"/><text x="1172" y="641" fill="#52637c" font-family=".SF NS Mono, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="start">SYSTEM CLAIM</text><text x="1172" y="686" fill="#151515" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">The unit is a packet, not a department.</text><rect width="704" height="132" x="78" y="782" fill="#fff" stroke="#cbd5e1" stroke-width="2" rx="13"/><text x="110" y="824" fill="#52637c" font-family=".SF NS Mono, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="start">COST OF A MISTAKE</text><text x="110" y="875" fill="#101828" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start">A clear boundary makes correction cheap.</text><rect width="704" height="132" x="818" y="782" fill="#fff" stroke="#cbd5e1" stroke-width="2" rx="13"/><text x="850" y="824" fill="#52637c" font-family=".SF NS Mono, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="start">EXIT CONDITION</text><text x="850" y="875" fill="#101828" font-family="Helvetica Neue, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">Make work legible before making it automatic.</text><text x="78" y="940" fill="#52637c" font-family=".SF NS Mono, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="start">HARNESS COMPANY · VISUAL 03 / 15</text></svg>